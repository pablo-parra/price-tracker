<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background: #3498db; color: white; padding: 24px 32px; }
        .header h1 { margin: 0; font-size: 22px; }
        .body { padding: 32px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th { background: #3498db; color: white; padding: 10px 14px; text-align: left; font-size: 13px; }
        td { padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        .below { color: #2ecc71; font-weight: bold; }
        .above { color: #e74c3c; }
        .footer { background: #f4f4f4; padding: 16px 32px; font-size: 12px; color: #aaa; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>&#128202; Daily Price Summary</h1>
    </div>
    <div class="body">
        <p>Here is the current price status for all your tracked products:</p>
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Current Price</th>
                    <th>Desired Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td>
                        <a th:href="${product.url}" th:text="${product.name}">Product</a>
                    </td>
                    <td th:text="${product.currentPrice != null} ? ('$' + #numbers.formatDecimal(product.currentPrice, 1, 2)) : 'Not crawled yet'">$0.00</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(product.desiredPrice, 1, 2)}">$0.00</td>
                    <td>
                        <span th:if="${product.currentPrice != null and product.currentPrice.compareTo(product.desiredPrice) < 0}"
                              class="below">&#10003; Below target</span>
                        <span th:if="${product.currentPrice != null and product.currentPrice.compareTo(product.desiredPrice) >= 0}"
                              class="above">&#8593; Above target</span>
                        <span th:if="${product.currentPrice == null}">&#8212;</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="footer">PriceTracker &mdash; Daily summary sent at your configured hour.</div>
</div>
</body>
</html>
