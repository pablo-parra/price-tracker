spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pricetracker}
    username: ${DB_USERNAME:pricetracker}
    password: ${DB_PASSWORD:pricetracker}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  crawler:
    user-agent: "Mozilla/5.0 (compatible; PriceTracker/1.0)"
    timeout-ms: 10000
    alert-cooldown-hours: 24
